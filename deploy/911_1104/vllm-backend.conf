# 911（sop119.service）的補充設定：程式改跑 119_261104，模型改接 GPU0 的 vLLM（port 8001）。
# 裝在 /etc/systemd/system/sop119.service.d/，取代原本的 llama-backend.conf。
# 主設定檔 sop119.service 不動；案件 json 一樣寫到 log_119，地址驗證網址與密碼也照舊。
[Unit]
After=vllm-gpu0.service
Requires=vllm-gpu0.service

[Service]
WorkingDirectory=/home/taiyan/project/nlp_cyberon_server/ai/119_261104_classify_summary_skip
Environment=LLM_BACKEND=vllm
Environment=VLLM_BASE_URL=http://127.0.0.1:8001/v1
Environment=VLLM_MODEL=/mnt/D/models/Qwen3.6-35B-A3B-FP8
# vLLM 啟動要 2～3 分鐘，這支只等 2 分鐘；沒等到會失敗，靠主設定檔的 Restart 再等一輪
ExecStartPre=/home/taiyan/project/nlp_cyberon_server/wait_llama.sh 8001
